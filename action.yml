name: 'Merge-Evidence Gate'
description: 'Re-runs an AI-agent pull request in a clean environment, checks its claims against what actually ran, and posts a receipt.'
author: 'AxiGate'
branding:
  icon: 'check-square'
  color: 'blue'

inputs:
  github-token:
    description: 'Token used to read the PR and post the receipt comment. Defaults to the workflow token.'
    required: false
    default: ${{ github.token }}
  test-command:
    description: 'Explicit test command to run. When omitted the gate detects one from .merge-evidence.yml, Makefile, package.json, go.mod, pyproject.toml, or Cargo.toml.'
    required: false
    default: ''
  agents-only:
    description: 'Only run when the PR looks agent-authored (bot login, branch prefix, body marker, co-author trailer). Set to "false" to gate every PR.'
    required: false
    default: 'true'
  fail-on:
    description: 'Verdict at or above which the job fails: "fail" (default), "needs-human", or "never" — report only: the comment, job summary, artifact and outputs are still produced, and no verdict fails the job.'
    required: false
    default: 'fail'
  base-comparison:
    description: 'When the head run fails, re-run the same command at the base commit so failures the repository already had are not counted against the PR: "auto" (default) or "never".'
    required: false
    default: 'auto'
  evidence:
    description: 'Where the evidence about the run comes from. "run" (default): re-run the tests on this runner. "report": read the report your own test step already wrote (see report-path) and run nothing. "none": no test evidence — the diff-based checks alone.'
    required: false
    default: 'run'
  report-path:
    description: 'With evidence: report — the test report(s) your test step wrote, relative to working-directory; several separated by newlines or commas. A missing, empty or unreadable report is no evidence, never a pass.'
    required: false
    default: ''
  report-format:
    description: 'With evidence: report — "auto" (default) recognises go -json, jest/vitest JSON and JUnit XML including node''s junit reporter; or one of go, pytest, jest, vitest, node-test, junit.'
    required: false
    default: 'auto'
  report-command:
    description: 'With evidence: report — the exact command your test step ran, recorded on the receipt and used to map claimed commands. When omitted the gate presumes the repository''s own test command and says so.'
    required: false
    default: ''
  sign:
    description: 'Sign the receipt: "none" (default); "attest" — a GitHub artifact attestation over receipt.json with this workflow''s own identity (needs id-token: write and attestations: write; verify with gh attestation verify); "key" — a detached Ed25519 signature in receipt.sig.json using signing-key (verify with merge-evidence verify).'
    required: false
    default: 'none'
  signing-key:
    description: 'With sign: key — an Ed25519 private key in PEM (PKCS#8), from a secret. Generate one with `merge-evidence keygen`.'
    required: false
    default: ''
  comment:
    description: 'Post/update the sticky receipt comment on the PR.'
    required: false
    default: 'true'
  upload-receipt:
    description: 'Upload receipt.json as a workflow artifact.'
    required: false
    default: 'true'
  policy-file:
    description: 'Path to a policy file (severity overrides, scope allowlist).'
    required: false
    default: '.merge-evidence.yml'
  working-directory:
    description: 'Directory to run the test command in.'
    required: false
    default: '.'

outputs:
  verdict:
    description: 'PASS | NEEDS_HUMAN | FAIL | NEUTRAL'
  receipt-path:
    description: 'Path to the generated receipt.json'
  discrepancies:
    description: 'Number of discrepancies found'
  receipt-sha256:
    description: 'sha256 (hex) of the receipt.json bytes — the subject a signature or attestation covers'
  attestation-id:
    description: 'With sign: attest — id of the stored attestation'
  attestation-url:
    description: 'With sign: attest — link to the attestation on GitHub'
  bundle-path:
    description: 'With sign: attest — path of the Sigstore bundle (receipt.sigstore.json), for offline verification'
  signature-path:
    description: 'With sign: key — path of receipt.sig.json'
  key-id:
    description: 'With sign: key — sha256 of the signing key''s public half, the name a verifier trusts'

runs:
  using: 'node24'
  main: 'dist/index.js'
