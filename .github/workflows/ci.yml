# CI runs exactly once per release: on the pull request from `build` into `main`
# (and on demand). Pushes to `build` deliberately trigger nothing — day-to-day
# verification happens locally (`npm run check`), so no Actions minutes are
# spent while the product is being built.
name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --passWithNoTests
      - run: npm run build
      - name: Committed bundle matches the source
        # ncc output is deterministic; a diff here means someone changed src/
        # without rebuilding, or built with different flags.
        run: |
          git diff --quiet -- dist/index.js || {
            echo '::error::dist/index.js is stale — run `npm run build` and commit it'
            git diff --stat -- dist/index.js
            exit 1
          }
      - name: Bundle loads on its own and action.yml points at it
        # The bundle must be self-contained: 0.1.0 shipped with a
        # `require('./sourcemap-register.js')` to a gitignored file and crashed
        # on every install. Run it as a non-PR event so it exits after the
        # "nothing to do" notice instead of gating this job.
        env:
          GITHUB_EVENT_NAME: push
        run: |
          test -f dist/index.js
          grep -q "main: 'dist/index.js'" action.yml
          ! grep -q "require('./" dist/index.js
          node dist/index.js
