# CI runs exactly once per release: on the pull request from `build` into `main`
# (and on demand). Pushes to `build` deliberately trigger nothing — day-to-day
# verification happens locally (`npm run check`), so no Actions minutes are
# spent while the product is being built.
name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --passWithNoTests
      - run: npm run build
      - name: Committed bundle matches the source
        # ncc output is deterministic; a diff here means someone changed src/
        # without rebuilding, or built with different flags.
        # The bundle may come with chunk files (`dist/<id>.index.js`) that a
        # dependency loads lazily; they must be committed alongside it, so the
        # fresh build is staged and compared as a set.
        run: |
          git add -f dist/index.js dist/*.index.js dist/licenses.txt
          git diff --cached --quiet -- dist || {
            echo '::error::dist/ is stale — run `npm run build` and commit dist/index.js and its chunk files'
            git diff --cached --stat -- dist
            exit 1
          }
      - name: Bundle loads on its own and action.yml points at it
        # The bundle must be self-contained: 0.1.0 shipped with a
        # `require('./sourcemap-register.js')` to a gitignored file and crashed
        # on every install. Run it as a non-PR event so it exits after the
        # "nothing to do" notice instead of gating this job. GITHUB_* variables
        # cannot be overridden with `env:`; a shell-level assignment reaches
        # the child process.
        run: |
          test -f dist/index.js
          grep -q "main: 'dist/index.js'" action.yml
          for chunk in dist/*.index.js; do [ -e "$chunk" ] && node -e "require('./$chunk')"; done
          ! grep -q "require('./" dist/index.js
          GITHUB_EVENT_NAME=push GITHUB_EVENT_PATH=/nonexistent node dist/index.js | tee /tmp/gate.out
          grep -q "nothing to do" /tmp/gate.out
